
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Password Toggler</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 25px;
            width: 300px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 10px #cccccc;
        }
        h2 {
            color: #247b7b;
        }
        .password-box {
            display: flex;
            align-items: center;
            border: 1px solid #999;
            border-radius: 5px;
            padding: 5px 8px;
        }
        input {
            width: 100%;
            min-width: 0;
            padding: 10px 5px;
            border: none;
            outline: none;
            font-size: 14px;
        }
        #eye {
            width: 25px;
            height: 25px;
            cursor: pointer;
            object-fit: contain;
        }
        button {
            margin-top: 20px;
            padding: 10px;
            width: 100%;
            background-color: #247b7b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #185858;
        }
        @media (max-width: 400px) {
            .container {
                width: 80%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Password Toggler</h2>
        <p>Enter your password</p>
        <div class="password-box">
            <input type="password" id="password"
                   placeholder="Enter password">

            <img
                src="https://cdn-icons-png.flaticon.com/512/709/709612.png"
                id="eye"
                alt="Show password"
                onclick="togglePassword()">
        </div>

        <button onclick="togglePassword()">Show / Hide Password</button>
    </div>

    <script>
        function togglePassword() {
            let password = document.getElementById("password");
            let eye = document.getElementById("eye");

            if (password.type === "password") {
                password.type = "text";
                eye.src =
                    "https://cdn-icons-png.flaticon.com/512/565/565655.png";
                eye.alt = "Hide password";
            } else {
                password.type = "password";
                eye.src =
                    "https://cdn-icons-png.flaticon.com/512/709/709612.png";
                eye.alt = "Show password";
            }
        }
    </script>

</body>
</html>
